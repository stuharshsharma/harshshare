<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boxing Arena</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101018;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
}

header {
    padding: 15px 10px;
    background: #191923;
    border-bottom: 2px solid #e63946;
}

header h1 {
    margin: 0;
    color: #ff4050;
    font-size: 28px;
}

header p {
    margin: 6px 0 0;
    color: #ccc;
    font-size: 13px;
}

.game-container {
    width: 100%;
    max-width: 900px;
    margin: 15px auto;
    padding: 0 10px;
}

.hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
}

.fighter-info {
    width: 44%;
    text-align: left;
}

.fighter-info.enemy {
    text-align: right;
}

.name {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 5px;
}

.health-bg {
    height: 16px;
    background: #34343f;
    border: 1px solid #777;
    border-radius: 4px;
    overflow: hidden;
}

.health {
    width: 100%;
    height: 100%;
    background: #35d07f;
    transition: width 0.15s;
}

.enemy .health {
    margin-left: auto;
}

.vs {
    color: #ff4050;
    font-weight: bold;
    font-size: 20px;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #242433;
    border: 2px solid #e63946;
    border-radius: 8px;
    touch-action: none;
}

.message {
    min-height: 25px;
    margin: 12px 0;
    color: #ffcf70;
    font-weight: bold;
}

.controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin: 12px 0;
}

.control-group {
    display: flex;
    gap: 8px;
}

button {
    border: none;
    border-radius: 10px;
    background: #292936;
    color: white;
    font-size: 17px;
    font-weight: bold;
    padding: 15px 18px;
    min-width: 54px;
    min-height: 52px;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

button:active {
    background: #e63946;
    transform: scale(0.96);
}

.punch {
    background: #e63946;
}

.restart {
    background: #303040;
    border: 1px solid #e63946;
    padding: 10px 20px;
    min-height: 42px;
    font-size: 14px;
}

.instructions {
    color: #bbb;
    font-size: 13px;
    line-height: 1.7;
    margin: 15px 0 25px;
}

.back {
    display: inline-block;
    color: white;
    text-decoration: none;
    padding: 10px 18px;
    background: #292936;
    border-radius: 8px;
    margin: 10px 0 20px;
}

@media (max-width: 500px) {
    header h1 {
        font-size: 24px;
    }

    .game-container {
        padding: 0 7px;
    }

    button {
        min-width: 47px;
        min-height: 48px;
        padding: 12px;
        font-size: 15px;
    }

    .controls {
        gap: 5px;
    }

    .control-group {
        gap: 5px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🥊 BOXING ARENA</h1>
    <p>Enter the ring. Fight to win!</p>
</header>

<div class="game-container">

    <div class="hud">
        <div class="fighter-info">
            <div class="name">YOU</div>
            <div class="health-bg">
                <div class="health" id="playerHealth"></div>
            </div>
        </div>

        <div class="vs">VS</div>

        <div class="fighter-info enemy">
            <div class="name">OPPONENT</div>
            <div class="health-bg">
                <div class="health" id="enemyHealth"></div>
            </div>
        </div>
    </div>

    <canvas id="game" width="800" height="450"></canvas>

    <div class="message" id="message">
        Fight! Move and punch your opponent.
    </div>

    <div class="controls">
        <div class="control-group">
            <button id="left">◀</button>
            <button id="right">▶</button>
        </div>

        <div class="control-group">
            <button id="block">🛡️</button>
            <button class="punch" id="punch">👊 PUNCH</button>
        </div>
    </div>

    <button class="restart" id="restart">↻ RESTART FIGHT</button>

    <div class="instructions">
        <b>Mobile:</b> Use the buttons to move, block and punch.<br>
        <b>PC:</b> A / D or arrow keys to move, Space to punch,
        and S to block.
    </div>

    <a class="back" href="/">← Back to HarshShare</a>
</div>

<script>
(() => {
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const playerBar = document.getElementById("playerHealth");
    const enemyBar = document.getElementById("enemyHealth");
    const message = document.getElementById("message");

    const W = canvas.width;
    const H = canvas.height;
    const FLOOR = 355;

    let player, enemy, keys, gameOver, frame, lastEnemyAttack;
    let effects = [];

    function makeFighter(x, color, glove, facing) {
        return {
            x,
            y: FLOOR,
            color,
            glove,
            facing,
            health: 100,
            punch: 0,
            block: false,
            hitFlash: 0,
            cooldown: 0,
            stun: 0
        };
    }

    function resetGame() {
        player = makeFighter(245, "#3985ff", "#ff4050", 1);
        enemy = makeFighter(555, "#ffb52e", "#f5f5f5", -1);

        keys = {};
        gameOver = false;
        frame = 0;
        lastEnemyAttack = 0;
        effects = [];

        playerBar.style.width = "100%";
        enemyBar.style.width = "100%";
        message.textContent = "Fight! Move and punch your opponent.";
    }

    function roundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
    }

    function drawRing() {
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, "#242433");
        bg.addColorStop(1, "#11111b");

        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        // Arena lights
        ctx.fillStyle = "rgba(255,255,255,0.04)";
        ctx.beginPath();
        ctx.moveTo(90, 0);
        ctx.lineTo(220, 0);
        ctx.lineTo(390, FLOOR);
        ctx.lineTo(200, FLOOR);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(610, 0);
        ctx.lineTo(740, 0);
        ctx.lineTo(600, FLOOR);
        ctx.lineTo(410, FLOOR);
        ctx.fill();

        // Audience
        for (let i = 0; i < 35; i++) {
            const x = 12 + i * 23;
            const y = 90 + Math.sin(i * 2) * 10;

            ctx.fillStyle = i % 2 ? "#393949" : "#4a3548";
            ctx.beginPath();
            ctx.arc(x, y, 7, 0, Math.PI * 2);
            ctx.fill();
        }

        // Ring floor
        ctx.fillStyle = "#343447";
        ctx.fillRect(40, FLOOR, 720, 60);

        ctx.strokeStyle = "#77778e";
        ctx.lineWidth = 3;

        [FLOOR, FLOOR + 17, FLOOR + 37].forEach(y => {
            ctx.beginPath();
            ctx.moveTo(35, y);
            ctx.lineTo(765, y);
            ctx.stroke();
        });

        // Ring posts
        ctx.fillStyle = "#d9d9e5";
        ctx.fillRect(35, FLOOR - 5, 10, 75);
        ctx.fillRect(755, FLOOR - 5, 10, 75);

        ctx.fillStyle = "#ff4050";
        ctx.fillRect(35, FLOOR + 10, 10, 7);
        ctx.fillRect(755, FLOOR + 10, 10, 7);
    }

    function drawFighter(f, isPlayer) {
        ctx.save();
        ctx.translate(f.x, f.y);

        if (f.hitFlash > 0 && Math.floor(frame / 3) % 2 === 0) {
            ctx.globalAlpha = 0.55;
        }

        const dir = f.facing;

        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.beginPath();
        ctx.ellipse(0, 3, 38, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Legs
        ctx.strokeStyle = "#dedee8";
        ctx.lineWidth = 13;
        ctx.lineCap = "round";

        ctx.beginPath();
        ctx.moveTo(-9, -45);
        ctx.lineTo(-16, -10);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(10, -45);
        ctx.lineTo(20, -10);
        ctx.stroke();

        // Shoes
        ctx.strokeStyle = "#252530";
        ctx.lineWidth = 12;

        ctx.beginPath();
        ctx.moveTo(-16, -10);
        ctx.lineTo(-5, -8);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(20, -10);
        ctx.lineTo(30, -8);
        ctx.stroke();

        // Body
        ctx.fillStyle = f.color;
        roundedRect(-23, -108, 46, 67, 10);
        ctx.fill();

        // Shorts
        ctx.fillStyle = "#20202b";
        ctx.fillRect(-23, -52, 46, 17);

        ctx.fillStyle = "#eeeeee";
        ctx.fillRect(-3, -51, 6, 15);

        // Neck
        ctx.fillStyle = "#d69b76";
        ctx.fillRect(-7, -119, 14, 15);

        // Head
        ctx.fillStyle = "#d69b76";
        ctx.beginPath();
        ctx.arc(0, -132, 21, 0, Math.PI * 2);
        ctx.fill();

        // Hair / head guard
        ctx.fillStyle = isPlayer ? "#182d55" : "#542525";
        ctx.beginPath();
        ctx.arc(0, -138, 21, Math.PI, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = "#171722";
        ctx.beginPath();
        ctx.arc(dir * 8, -133, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Arms
        ctx.lineWidth = 12;
        ctx.strokeStyle = "#d69b76";

        ctx.beginPath();
        ctx.moveTo(-19, -98);
        ctx.lineTo(-30, -76);
        ctx.lineTo(-17, -65);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(19, -98);

        const reach = f.punch > 0 ? 38 : 0;
        const armX = dir * (30 + reach);
        const armY = f.punch > 0 ? -91 : (f.block ? -120 : -77);

        ctx.lineTo(armX, armY);
        ctx.stroke();

        // Gloves
        ctx.fillStyle = f.glove;

        ctx.beginPath();
        ctx.arc(-17, -65, 13, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(armX, armY, 15, 0, Math.PI * 2);
        ctx.fill();

        // Glove detail
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(armX - 7, armY - 3);
        ctx.lineTo(armX + 7, armY - 3);
        ctx.stroke();

        if (f.block) {
            ctx.strokeStyle = "#78c9ff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, -100, 43, -2.2, 0.4);
            ctx.stroke();
        }

        ctx.restore();
    }

    function addEffect(x, y, text) {
        effects.push({
            x,
            y,
            text,
            life: 28
        });
    }

    function drawEffects() {
        effects.forEach(e => {
            ctx.globalAlpha = Math.max(0, e.life / 28);
            ctx.fillStyle = "#ffdf68";
            ctx.font = "bold 24px Arial";
            ctx.textAlign = "center";
            ctx.fillText(e.text, e.x, e.y);
            e.y -= 1;
            e.life--;
        });

        effects = effects.filter(e => e.life > 0);
        ctx.globalAlpha = 1;
    }

    function punch(attacker, defender, playerAttack) {
        if (gameOver || attacker.cooldown > 0 || attacker.stun > 0) {
            return;
        }

        attacker.punch = 9;
        attacker.cooldown = 25;

        const distance = Math.abs(attacker.x - defender.x);

        if (distance < 105) {
            if (defender.block) {
                addEffect(defender.x, defender.y - 145, "BLOCK!");
            } else {
                defender.health = Math.max(0, defender.health - 10);
                defender.hitFlash = 8;
                defender.stun = 7;

                addEffect(
                    defender.x,
                    defender.y - 160,
                    "POW!"
                );

                if (playerAttack) {
                    enemyBar.style.width = defender.health + "%";
                } else {
                    playerBar.style.width = defender.health + "%";
                }
            }
        } else if (playerAttack) {
            addEffect(attacker.x + 35, attacker.y - 155, "MISS!");
        }

        if (defender.health <= 0) {
            gameOver = true;

            message.textContent = playerAttack
                ? "🏆 YOU WIN! Great fight!"
                : "💥 YOU LOSE! Try again!";

            addEffect(W / 2, 150, playerAttack ? "KNOCKOUT!" : "DEFEATED");
        }
    }

    function update() {
        if (gameOver) return;

        frame++;

        [player, enemy].forEach(f => {
            if (f.punch > 0) f.punch--;
            if (f.cooldown > 0) f.cooldown--;
            if (f.hitFlash > 0) f.hitFlash--;
            if (f.stun > 0) f.stun--;
        });

        player.block = !!keys.block;

        if (player.stun === 0) {
            if (keys.left) player.x -= 3;
            if (keys.right) player.x += 3;
        }

        player.x = Math.max(80, Math.min(720, player.x));

        // Opponent AI
        const distance = Math.abs(enemy.x - player.x);

        enemy.block = false;

        if (enemy.stun === 0) {
            if (distance > 80) {
                enemy.x += player.x > enemy.x ? 1.5 : -1.5;
            } else if (frame - lastEnemyAttack > 48) {
                if (Math.random() < 0.22) {
                    enemy.block = true;
                } else {
                    punch(enemy, player, false);
                }

                lastEnemyAttack = frame;
            } else if (Math.random() < 0.012) {
                enemy.block = true;
            }
        }

        enemy.x = Math.max(80, Math.min(720, enemy.x));

        player.facing = player.x < enemy.x ? 1 : -1;
        enemy.facing = enemy.x < player.x ? 1 : -1;
    }

    function render() {
        drawRing();

        // Draw enemy first
        drawFighter(enemy, false);
        drawFighter(player, true);

        drawEffects();
    }

    function loop() {
        update();
        render();
        requestAnimationFrame(loop);
    }

    function bindHold(id, key) {
        const button = document.getElementById(id);

        button.addEventListener("pointerdown", e => {
            e.preventDefault();
            keys[key] = true;

            if (button.setPointerCapture) {
                try {
                    button.setPointerCapture(e.pointerId);
                } catch (_) {}
            }
        });

        ["pointerup", "pointercancel", "lostpointercapture"].forEach(event => {
            button.addEventListener(event, () => {
                keys[key] = false;
            });
        });
    }

    bindHold("left", "left");
    bindHold("right", "right");
    bindHold("block", "block");

    document.getElementById("punch").addEventListener("pointerdown", e => {
        e.preventDefault();
        punch(player, enemy, true);
    });

    document.getElementById("restart").addEventListener("click", resetGame);

    document.addEventListener("keydown", e => {
        if ([
            "ArrowLeft", "ArrowRight", "ArrowUp",
            "ArrowDown", " "
        ].includes(e.key)) {
            e.preventDefault();
        }

        if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
            keys.left = true;
        }

        if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
            keys.right = true;
        }

        if (e.key.toLowerCase() === "s") {
            keys.block = true;
        }

        if (e.code === "Space" && !e.repeat) {
            punch(player, enemy, true);
        }
    });

    document.addEventListener("keyup", e => {
        if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
            keys.left = false;
        }

        if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
            keys.right = false;
        }

        if (e.key.toLowerCase() === "s") {
            keys.block = false;
        }
    });

    window.addEventListener("blur", () => {
        if (keys) keys = {};
    });

    resetGame();
    loop();
})();
</script>

</body>
</html>
